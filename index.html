<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">

  <meta property="og:type" content="website">
  <meta property="og:title" content="저희의 첫 계절을 축복해주세요">
  <meta property="og:description" content="2026.08.01. 03:30pm.">
  <meta property="og:image" content="https://cofks77.github.io/my-wedding/images/og/1.jpg">
  <meta name="description" content="">

  <title>Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>

  <div id="curtain" class="curtain">
    <div class="curtain__wash curtain__wash--top"></div>
    <div class="curtain__wash curtain__wash--bottom"></div>
    <div class="curtain__content">
      <p class="curtain__subtitle">Wedding Invitation</p>
      <p class="curtain__names" id="curtainNames"></p>
      <button class="curtain__btn" id="curtainBtn">초대장 열기</button>
    </div>
  </div>

  <canvas id="sparkleCanvas" class="sparkle-canvas"></canvas>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="photoModal" class="photo-modal" role="dialog" aria-modal="true" aria-label="사진 보기">
    <button class="photo-modal__close" id="modalClose" aria-label="닫기">&times;</button>
    <button class="photo-modal__nav photo-modal__nav--prev" id="modalPrev" aria-label="이전 사진">&#8249;</button>
    <button class="photo-modal__nav photo-modal__nav--next" id="modalNext" aria-label="다음 사진">&#8250;</button>
    <div class="photo-modal__container" id="modalContainer">
      <img class="photo-modal__img" id="modalImg" src="" alt="사진" draggable="false">
    </div>
    <div class="photo-modal__counter" id="modalCounter"></div>
  </div>

  <main id="mainContent" class="main-content">

    <section class="section hero" id="hero">
      <div class="hero__overlay"></div>
      <img class="hero__photo" id="heroPhoto" src="" alt="웨딩 사진" loading="eager">
      <div class="hero__content">
        <p class="hero__label animate-item" data-animate="fade-down">Wedding Invitation</p>
        <h1 class="hero__names animate-item" data-animate="fade-up" id="heroNames"></h1>
        <div class="hero__divider animate-item" data-animate="fade-in"></div>
        <p class="hero__date animate-item" data-animate="fade-up" id="heroDate"></p>
        <p class="hero__venue animate-item" data-animate="fade-up" id="heroVenue"></p>
      </div>
      <div class="countdown animate-item" data-animate="fade-up" id="countdown">
        <p class="countdown__label" id="countdownLabel"></p>
        <div class="countdown__timer">
          <div class="countdown__item"><span class="countdown__number" id="countDays">0</span><span class="countdown__unit">일</span></div>
          <div class="countdown__sep">:</div>
          <div class="countdown__item"><span class="countdown__number" id="countHours">0</span><span class="countdown__unit">시간</span></div>
          <div class="countdown__sep">:</div>
          <div class="countdown__item"><span class="countdown__number" id="countMinutes">0</span><span class="countdown__unit">분</span></div>
          <div class="countdown__sep">:</div>
          <div class="countdown__item"><span class="countdown__number" id="countSeconds">0</span><span class="countdown__unit">초</span></div>
        </div>
      </div>
    </section>

    <section class="section greeting" id="greeting">
      <div class="wc-blob wc-blob--greeting"></div>
      <div class="section__inner">
        <div class="wc-ornament animate-item" data-animate="fade-in"></div>
        <h2 class="section__title animate-item" data-animate="fade-up" id="greetingTitle"></h2>
        <p class="greeting__text animate-item" data-animate="fade-up" id="greetingContent"></p>
        <div class="greeting__parents animate-item" data-animate="fade-up" id="greetingParents"></div>
      </div>
      <div class="wc-divider"></div>
    </section>

    <section class="section calendar-section" id="calendarSection">
      <div class="wc-blob wc-blob--calendar"></div>
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up">예식 일시</h2>
        <div class="calendar animate-item" data-animate="scale-in" id="calendarGrid"></div>
        <div class="calendar-actions animate-item" data-animate="fade-up">
          <a class="btn btn--outline" id="googleCalBtn" href="#" target="_blank" rel="noopener">Google 캘린더</a>
          <button class="btn btn--outline" id="icsDownloadBtn">Apple 캘린더</button>
        </div>
      </div>
      <div class="wc-divider"></div>
    </section>

    <section class="section story" id="story">
      <div class="wc-blob wc-blob--story"></div>
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up" id="storyTitle"></h2>
        <p class="story__text animate-item" data-animate="fade-up" id="storyContent"></p>
        <div class="story__photos" id="storyPhotos"></div>
      </div>
      <div class="wc-divider"></div>
    </section>

    <section class="section gallery" id="gallery">
      <div class="wc-blob wc-blob--gallery"></div>
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up">갤러리</h2>
        <div class="gallery__grid" id="galleryGrid"></div>
      </div>
      <div class="wc-divider"></div>
    </section>

    <section class="section location" id="location">
      <div class="wc-blob wc-blob--location"></div>
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up">오시는 길</h2>
        <div class="location__info animate-item" data-animate="fade-up">
          <p class="location__venue" id="locationVenue"></p>
          <p class="location__hall" id="locationHall"></p>
          <p class="location__address" id="locationAddress"></p>
          <p class="location__tel" id="locationTel"></p>
        </div>
        <button class="btn btn--text location__copy animate-item" data-animate="fade-up" id="copyAddressBtn">주소 복사</button>
        <div class="location__map animate-item" data-animate="scale-in">
          <img class="location__map-img" id="locationMapImg" src="" alt="약도" loading="lazy">
        </div>
        <div class="location__links animate-item" data-animate="fade-up">
          <a class="btn btn--kakao" id="kakaoMapBtn" href="#" target="_blank" rel="noopener">카카오맵</a>
          <a class="btn btn--naver" id="naverMapBtn" href="#" target="_blank" rel="noopener">네이버지도</a>
        </div>
      </div>
      <div class="wc-divider"></div>
    </section>

    <section class="section account" id="account">
      <div class="wc-blob wc-blob--account"></div>
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up">마음 전하실 곳</h2>
        <p class="account__desc animate-item" data-animate="fade-up">축하의 마음을 담아 축의금을 전달해 보세요.</p>
        <div class="accordion animate-item" data-animate="fade-up">
          <button class="accordion__trigger" id="groomAccordion" aria-expanded="false">신랑측 계좌번호</button>
          <div class="accordion__panel" id="groomAccordionPanel"><div class="accordion__panel-inner" id="groomAccountList"></div></div>
        </div>
        <div class="accordion animate-item" data-animate="fade-up">
          <button class="accordion__trigger" id="brideAccordion" aria-expanded="false">신부측 계좌번호</button>
          <div class="accordion__panel" id="brideAccordionPanel"><div class="accordion__panel-inner" id="brideAccountList"></div></div>
        </div>
      </div>
    </section>

    <section class="rsvp-section" style="padding: 50px 20px; text-align: center; max-width: 450px; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
      <h2 style="margin-bottom: 8px; color: #4a4a4a; font-size: 20px; font-weight: 500; letter-spacing: -0.5px;">참석 의사 전달하기</h2>
      <p style="font-size: 13px; color: #888; margin-bottom: 30px; line-height: 1.6;">원활한 예식 준비를 위해<br>참석 여부를 미리 알려주시면 감사하겠습니다.</p>
      
      <form id="rsvp-form" style="text-align: left; background: #faf8f5; padding: 25px 20px; border-radius: 12px; border: 1px solid #f0eae1; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
        
        <div style="margin-bottom: 20px;">
          <label for="rsvp-name" style="display:block; margin-bottom:8px; font-weight:600; font-size:14px; color:#555;">성함</label>
          <input type="text" id="rsvp-name" required placeholder="성함을 입력해 주세요" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px; box-sizing: border-box; font-size: 14px; -webkit-appearance: none;">
        </div>

        <div style="margin-bottom: 20px;">
          <span style="display:block; margin-bottom:8px; font-weight:600; font-size:14px; color:#555;">구분</span>
          <div style="display: flex; gap: 20px;">
            <label style="display:flex; align-items:center; font-size:14px; cursor:pointer;"><input type="radio" name="rsvp-side" value="신랑측" checked style="margin-right:6px; width:16px; height:16px;"> 신랑측</label>
            <label style="display:flex; align-items:center; font-size:14px; cursor:pointer;"><input type="radio" name="rsvp-side" value="신부측" style="margin-right:6px; width:16px; height:16px;"> 신부측</label>
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <span style="display:block; margin-bottom:8px; font-weight:600; font-size:14px; color:#555;">참석 여부</span>
          <div style="display: flex; gap: 20px;">
            <label style="display:flex; align-items:center; font-size:14px; cursor:pointer;"><input type="radio" name="rsvp-attend" value="참석" checked style="margin-right:6px; width:16px; height:16px;"> 참석합니다</label>
            <label style="display:flex; align-items:center; font-size:14px; cursor:pointer;"><input type="radio" name="rsvp-attend" value="불참" style="margin-right:6px; width:16px; height:16px;"> 마음으로 축하합니다</label>
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <span style="display:block; margin-bottom:8px; font-weight:600; font-size:14px; color:#555;">식사 여부</span>
          <div style="display: flex; gap: 20px;">
            <label style="display:flex; align-items:center; font-size:14px; cursor:pointer;"><input type="radio" name="rsvp-meal" value="식사함" checked style="margin-right:6px; width:16px; height:16px;"> 식사 예정</label>
            <label style="display:flex; align-items:center; font-size:14px; cursor:pointer;"><input type="radio" name="rsvp-meal" value="식사안함" style="margin-right:6px; width:16px; height:16px;"> 식사 안함</label>
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <label for="rsvp-guests" style="display:block; margin-bottom:8px; font-weight:600; font-size:14px; color:#555;">동반 인원 (본인 제외)</label>
          <select id="rsvp-guests" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px; background-color:#fff; font-size:14px; box-sizing: border-box;">
            <option value="없음">없음</option>
            <option value="1명">1명</option>
            <option value="2명">2명</option>
            <option value="3명 이상">3명 이상</option>
          </select>
        </div>

        <div style="margin-bottom: 25px;">
          <label for="rsvp-message" style="display:block; margin-bottom:8px; font-weight:600; font-size:14px; color:#555;">축하 메시지</label>
          <textarea id="rsvp-message" rows="3" placeholder="축하의 한마디를 남겨주세요 (방명록에 노출됩니다)" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px; box-sizing: border-box; resize: none; font-size: 14px; line-height: 1.5; -webkit-appearance: none;"></textarea>
        </div>

        <button type="submit" id="rsvp-submit-btn" style="width:100%; padding:14px; background-color: #c2b09b; color:#fff; border:none; border-radius:6px; font-size:15px; cursor:pointer; font-weight:bold; letter-spacing: 0.5px;">의사 전달하기</button>
      </form>

      <div class="guestbook-section" style="margin-top: 50px; text-align: left;">
        <h3 style="text-align: center; font-size: 17px; color: #4a4a4a; margin-bottom: 25px; font-weight: 500;">축하의 한마디 💕</h3>
        <div id="loading-messages" style="text-align: center; color: #aaa; font-size: 13px; padding: 20px;">메시지를 가져오는 중입니다...</div>
        <div id="message-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
      </div>
    </section>

    <script>
      (function() {
        var form = document.getElementById('rsvp-form');
        var sheetDbUrl = 'https://sheetdb.io/api/v1/imy4ki6djb4r2';

        function loadMessages() {
          var messageList = document.getElementById('message-list');
          var loadingDiv = document.getElementById('loading-messages');

          fetch(sheetDbUrl)
            .then(function(res) { return res.json(); })
            .then(function(data) {
              loadingDiv.style.display = 'none';
              messageList.innerHTML = '';

              if (!data || data.length === 0 || data.error) {
                messageList.innerHTML = '<div style="text-align:center; color:#bbb; font-size:13px; padding:30px 0;">첫 번째 축하 메시지의 주인공이 되어보세요!</div>';
                return;
              }

              var validMessageCount = 0;
              data.slice().reverse().forEach(function(item) {
                if (!item.message || item.message.trim() === '') return;
                validMessageCount++;

                var card = document.createElement('div');
                card.style.cssText = 'background:#fdfcfb; padding:16px; border-radius:10px; border:1px solid #ede6dc; margin-bottom:12px;';

                var topRow = document.createElement('div');
                topRow.style.cssText = 'display:flex; justify-content:space-between; margin-bottom:10px; font-size:13px;';
                
                var nameInfo = document.createElement('span');
                nameInfo.style.fontWeight = 'bold';
                nameInfo.style.color = '#555';
                nameInfo.innerText = item.name + ' (' + (item.side || '하객') + ')';

                var attendTag = document.createElement('span');
                var isAttend = (item.attend === '참석');
                attendTag.style.color = isAttend ? '#8ba888' : '#bfa6a6';
                attendTag.style.fontSize = '12px';
                attendTag.style.fontWeight = '600';
                attendTag.innerText = isAttend ? '♥ 참석' : '마음으로 축하';

                topRow.appendChild(nameInfo);
                topRow.appendChild(attendTag);

                var bodyRow = document.createElement('div');
                bodyRow.style.cssText = 'font-size:14px; color:#444; line-height:1.55; white-space:pre-wrap; word-break:break-all;';
                bodyRow.innerText = item.message;

                card.appendChild(topRow);
                card.appendChild(bodyRow);
                messageList.appendChild(card);
              });

              if (validMessageCount === 0) {
                messageList.innerHTML = '<div style="text-align:center; color:#bbb; font-size:13px; padding:30px 0;">첫 번째 축하 메시지의 주인공이 되어보세요!</div>';
              }
            })
            .catch(function(err) {
              console.error(err);
              loadingDiv.innerText = '방명록을 불러오는 중 오류가 발생했습니다.';
            });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadMessages);
        } else {
          loadMessages();
        }

        form.addEventListener('submit', function(e) {
          e.preventDefault();

          var btn = document.getElementById('rsvp-submit-btn');
          btn.disabled = true;
          btn.innerText = '전송 중...';

          var sideActive = form.querySelector('input[name="rsvp-side"]:checked');
          var attendActive = form.querySelector('input[name="rsvp-attend"]:checked');
          var mealActive = form.querySelector('input[name="rsvp-meal"]:checked');

          var payload = {
            name: document.getElementById('rsvp-name').value,
            side: sideActive ? sideActive.value : '신랑측',
            attend: attendActive ? attendActive.value : '참석',
            meal: mealActive ? mealActive.value : '식사함',
            guests: document.getElementById('rsvp-guests').value,
            message: document.getElementById('rsvp-message').value
          };

          fetch(sheetDbUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify([payload])
          })
          .then(function(res) {
            if (res.ok) return res.json();
            throw new Error('전송오류');
          })
          .then(function() {
            alert('참석 의사가 안전하게 전달되었습니다. 감사합니다! 💕');
            form.reset();
            btn.disabled = false;
            btn.innerText = '의사 전달하기';
            loadMessages(); 
          })
          .catch(function(err) {
            alert('전송에 실패했습니다. 구글 시트 구조와 일치하는지 확인해주세요.');
            btn.disabled = false;
            btn.innerText = '의사 전달하기';
          });
        });
      })();
    </script>

    <footer class="footer">
      <p class="footer__text" id="footerText"></p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
