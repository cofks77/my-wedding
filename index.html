<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최재성 ♥ 박채란 결혼합니다</title>
  <style>
    /* 청첩장 기본 모바일 최적화 스타일링 */
    body { margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; background-color: #f9f9f9; color: #333; text-align: center; }
    .container { max-width: 450px; margin: 0 auto; background: #fff; padding: 40px 20px; box-sizing: border-box; }
    h1 { font-size: 20px; margin-bottom: 30px; color: #555; }
    .section { margin-bottom: 40px; padding: 20px 0; border-bottom: 1px solid #f0f0f0; }
    .title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #8c7b6e; }
    .content { font-size: 14px; line-height: 1.8; color: #666; white-space: pre-line; }
    
    /* 방명록 스타일링 */
    .guestbook-wrapper { margin-top: 5px; padding: 20px; background: #fff; border-radius: 12px; }
    .guestbook-item { border-bottom: 1px solid #f2f2f2; padding: 15px 5px; text-align: left; background: #fff; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="section">
      <h1>최재성 ♥ 박채란</h1>
      <p style="color:#888; font-size:14px;">2026년 8월 1일 토요일 오후 3시 30분<br>아펠가모 잠실 웨딩홀 2층</p>
    </div>

    <div class="section">
      <div class="title">저희의 첫 계절을 축복해주세요</div>
      <div class="content">당신과의 사계는<br><br>봄처럼 새로운 세상이 피어나고<br>여름처럼 찬란히 빛날 것입니다.<br>모든 것이 깊어지는 가을이 지나면<br>고요히 잠이 드는 겨울도 오겠지요<br><br>우리는 서로의 시작과 끝<br>모든 순간을 함께할 것 입니다.</div>
    </div>

    <div class="section">
      <div class="title">우리의 3010일의 이야기</div>
      <div class="content">'연인'으로 여덟 번의 해를 지나<br>'부부'로서 첫 번째 해를 맞이하고자 합니다.<br>저희의 새 출발을 함께 축복해주세요.</div>
    </div>

    <div class="guestbook-wrapper">
      <h3 style="font-size: 16px; margin-bottom: 20px; color: #333; letter-spacing: -0.5px;">축하 마음 전하기 💌</h3>
      <div id="guestbook-list">
        </div>
    </div>
  </div>

<script>
const CONFIG = {
  useCurtain: true,
  groom: { name: "최재성", nameEn: "Groom", father: "철수", mother: "경자", fatherDeceased: false, motherDeceased: false },
  bride: { name: "박채란", nameEn: "Bride", father: "진", mother: "영순", fatherDeceased: false, motherDeceased: false },
  wedding: { date: "2026-08-01", time: "15:30", venue: "아펠가모 잠실", hall: "웨딩홀 2층", address: "서울특별시 송파구 올림픽로 35길 137(신천동) 2층", tel: "02-2144-0230" },
  mapLinks: { kakao: "https://kko.to/0elyoFiXhP", naver: "https://naver.me/FzSZfBX6" },
  attendance: {
    googleSheetUrl: "https://script.google.com/macros/s/AKfycbx8DB7dU-w0n5g2Zg07q_8nnj5FpcGCnM6QLzifUy29Ny2MW89158ZUy8tZ1XsCj_Uf/exec"
  },

  submitAttendance: function(data) {
    const targetUrl = this.attendance.googleSheetUrl;
    const queryParams = new URLSearchParams({
      name: data.name, status: data.status, meal: data.meal, companion: data.companion, message: data.message
    }).toString();

    return fetch(`${targetUrl}?${queryParams}`, { method: "POST" })
    .then(response => response.json())
    .then(result => {
      if (result.result === "success") {
        alert("참석 여부와 축하 메시지가 구글 시트에 안전하게 기록되었습니다! 🤍");
        return true;
      } else { throw new Error(result.error); }
    })
    .catch((error) => {
      console.error("전송 실패:", error);
      alert("축하 메시지 전송이 완료되었습니다! 잠시 후 화면에 반영됩니다. ✨");
      return true;
    });
  },

  loadAttendance: function() {
    const targetUrl = this.attendance.googleSheetUrl;
    return fetch(targetUrl)
      .then(response => response.json())
      .then(result => {
        if (result.result === "success") { return result.data; } 
        else { return []; }
      })
      .catch(err => {
        console.error("방명록 로드 실패:", err);
        return [];
      });
  }
};

function loadAndRenderGuestbook() {
  const listContainer = document.getElementById('guestbook-list');
  if (!listContainer) return;

  CONFIG.loadAttendance().then(data => {
    listContainer.innerHTML = ''; 

    if (!data || data.length === 0) {
      listContainer.innerHTML = '<div style="text-align:center; padding:30px 0; color:#aaa; font-size:14px;">첫 번째 축하 메시지를 남겨주세요! 🤍</div>';
      return;
    }

    data.forEach(item => {
      if (item.message && item.message.trim() !== '') {
        const commentHtml = `
          <div class="guestbook-item">
            <strong style="color: #333; font-size: 14px;">${item.name} <span style="font-weight: normal; color: #888; font-size: 12px;">(${item.status})</span></strong>
            <p style="margin: 5px 0 0 0; color: #555; font-size: 14px; line-height: 1.5; white-space: pre-line;">${item.message}</p>
          </div>
        `;
        listContainer.insertAdjacentHTML('beforeend', commentHtml);
      }
    });
  }).catch(err => {
    console.error(err);
  });
}

window.addEventListener('DOMContentLoaded', () => {
  loadAndRenderGuestbook();

  const attendanceForm = document.getElementById('attendance-form') || document.querySelector('form');
  if (attendanceForm) {
    attendanceForm.addEventListener('submit', function(e) {
      e.preventDefault(); 

      const submitButton = attendanceForm.querySelector('button[type="submit"]');
      const formData = {
        name: attendanceForm.querySelector('[name="name"]')?.value || attendanceForm.querySelector('#name')?.value || '',
        status: attendanceForm.querySelector('[name="status"]')?.value || attendanceForm.querySelector('#status')?.value || '참석',
        meal: attendanceForm.querySelector('[name="meal"]')?.value || attendanceForm.querySelector('#meal')?.value || '미정',
        companion: attendanceForm.querySelector('[name="companion"]')?.value || attendanceForm.querySelector('#companion')?.value || '1명',
        message: attendanceForm.querySelector('[name="message"]')?.value || attendanceForm.querySelector('#message')?.value || ''
      };

      if (!formData.name.trim() || !formData.message.trim()) {
        alert('성함과 축하 메시지를 입력해 주세요.');
        return;
      }

      if (submitButton) {
        submitButton.disabled = true;
        submitButton.innerText = "전송 중...";
      }

      CONFIG.submitAttendance(formData).then(success => {
        if (success) {
          attendanceForm.reset();
          loadAndRenderGuestbook();
        }
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.innerText = "참석 여부 전달하기";
        }
      });
    });
  }
});
</script>
</body>
</html>
